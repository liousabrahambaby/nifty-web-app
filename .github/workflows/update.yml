# Full refresh every weekday at 4:00 PM IST (10:30 UTC), after NSE closes at 3:30 PM.
# Pre-market run every weekday at 8:15 AM IST (02:45 UTC): news, global markets and the
# opening-gap forecast. GitHub can start scheduled runs 5-20 minutes late, so 8:15 lands
# it close to 8:30 and well before the 9:15 open.
# News/global run every 4 hours (:17 past 00/04/08/12/16/20 UTC = 5:47 AM, 9:47 AM,
# 1:47 PM, 5:47 PM, 9:47 PM and 1:47 AM IST, all week): news and global markets only. Nifty prices,
# signals and the gap forecast are untouched, so they still change only at 4 PM / 8:15 AM.
# (:17 rather than :00 because GitHub's top-of-the-hour queue is the most delayed.)
#
# After each data update the React site is rebuilt and deployed to GitHub Pages.
# A push to main (code changes, or data pushed by update_local / premarket_local)
# skips the analysis and just rebuilds and deploys.
name: Update Nifty data

on:
  schedule:
    - cron: "30 10 * * 1-5"
    - cron: "45 2 * * 1-5"
    - cron: "17 */4 * * *"   # every 4 hours: news + global markets
  push:
    branches: [main]
  workflow_dispatch:      # lets you run it manually from the Actions tab
    inputs:
      mode:
        description: "full (after close), premarket (morning forecast) or hourly (news + global markets)"
        type: choice
        options: [full, premarket, hourly]
        default: full
      request_token:
        description: "Kite request token (optional, from the Connect GIFT Nifty page). Adds GIFT Nifty to the forecast."
        type: string
        required: false

concurrency:            # never let two runs write data.json or deploy at the same time
  group: nifty-data
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run analysis
        env:   # optional: only needed for GIFT Nifty (Settings -> Secrets and variables -> Actions)
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_API_SECRET: ${{ secrets.KITE_API_SECRET }}
          KITE_REQUEST_TOKEN: ${{ inputs.request_token }}
          # optional: Claude writes the AI analysis in the 4 PM run; without it a rule-based note is used
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ github.event.schedule }}" = "45 2 * * 1-5" ] || [ "${{ inputs.mode }}" = "premarket" ]; then
            python analyze.py --premarket
          elif [ "${{ github.event.schedule }}" = "17 */4 * * *" ] || [ "${{ inputs.mode }}" = "hourly" ]; then
            python analyze.py --hourly
          else
            python analyze.py
          fi
      - name: Commit new data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data.json track.json
          for f in oc_cache.json gap_track.json analysis_track.json; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet || git commit -m "Data update $(date -u '+%F %H:%M') UTC"
          git pull --rebase -q || true
          git push

  deploy:
    needs: update
    # runs after a successful update, or on its own for a push (when update is skipped)
    if: ${{ !cancelled() && needs.update.result != 'failure' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}   # the branch tip, so it includes the data commit made above
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build
      # Keep the three Pages actions on matching current majors: an older upload-pages-artifact
      # with a newer deploy-pages fails with 'No artifacts named "github-pages" were found'.
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
