<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Nifty Cockpit">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22327A"/><stop offset="1" stop-color="#0E1433"/>
    </linearGradient>
    <linearGradient id="ln" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#45D8FF" stop-opacity=".75"/><stop offset="1" stop-color="#45D8FF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- chamfered tile -->
  <path d="M2 2H50L62 14V62H14L2 50Z" fill="url(#bg)"/>
  <path d="M2.75 2.75H49.7L61.25 14.3V61.25H14.3L2.75 49.7Z" fill="none" stroke="#45D8FF" stroke-opacity=".45" stroke-width="1.5"/>
  <!-- N-wave breakout -->
  <polyline points="12,47 24,19 37,40 51,13" fill="none" stroke="url(#ln)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="51" cy="13" r="5.5" fill="#2EE59D" filter="url(#glow)"/>
</svg>
